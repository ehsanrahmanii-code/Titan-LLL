name: Build Titan LLL APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Check TITAN file
        run: |
          if [ ! -f "TITAN_PRO_V75_PWA.py" ]; then
            echo "ERROR: Upload TITAN_PRO_V75_PWA.py to repo root"
            exit 1
          fi
          ls -lah TITAN_PRO_V75_PWA.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip python3-pip python3-venv autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev libltdl-dev gettext autopoint libgettextpo-dev build-essential ccache
      - name: Install Buildozer
        run: |
          pip install --upgrade pip setuptools wheel
          pip install "cython==0.29.36"
          pip install buildozer
      - name: Build APK
        run: |
          rm -rf .buildozer/android/platform/build-arm64-v8a || true
          buildozer -v android debug
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
      - name: Show APK
        if: always()
        run: ls -lah bin/ || true; find . -name "*.apk" | head
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Titan-LLL-APK
          path: bin/*.apk
          if-no-files-found: warn
          retention-days: 14
