name: Build Titan LLL APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build Android APK (Chaquopy)
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - name: Check TITAN source
        run: |
          test -f TITAN_PRO_V75_PWA.py
          ls -lah TITAN_PRO_V75_PWA.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Accept SDK licenses and install platforms
        run: |
          set -e
          yes | sdkmanager --licenses >/tmp/sdk-licenses.txt || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME"

      - name: Prepare Python sources for Chaquopy
        run: |
          mkdir -p app/src/main/python
          cp -f TITAN_PRO_V75_PWA.py app/src/main/python/
          python3 scripts/patch_titan.py

      - name: Create default launcher icon
        run: python3 scripts/make_icons.py

      - name: Setup Gradle wrapper
        run: |
          curl -sL -o /tmp/gradle-8.7-bin.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          sudo unzip -qo /tmp/gradle-8.7-bin.zip -d /opt
          /opt/gradle-8.7/bin/gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Gradle assembleDebug
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate APK
        if: always()
        run: |
          find app/build/outputs -name "*.apk" -ls || true
          ls -lah app/build/outputs/apk/debug/ || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Titan-LLL-Full-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
